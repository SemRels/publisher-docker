name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test, lint, and scan
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.go == '1.27rc1' }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "1.26", "1.27rc1"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go == '1.27rc1' && '1.27.0-rc.1' || format('{0}.x', matrix.go) }}
          allow-prereleases: true
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        if: matrix.go != '1.27rc1'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run tests
        run: go test -race -v -coverprofile=coverage.txt ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.txt | tail -1

      - name: Upload coverage report
        if: matrix.go == '1.26'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 30
          if-no-files-found: error

      - name: Build plugin binary
        run: go build -v ./cmd/plugin

      - name: Run Trivy filesystem scan
        if: matrix.go == '1.26'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  docker-integration:
    name: Docker registry integration
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for local registry
        run: timeout 30s bash -c 'until curl --fail --silent http://localhost:5000/v2/; do sleep 1; done'

      - name: Build, publish, pull, and verify a real image
        env:
          SEMREL_TEST_DOCKER_REGISTRY: localhost:5000
        run: go test -count=1 -tags=integration -timeout=5m ./cmd/plugin

  actionlint:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Run actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
